name: fetch-brand
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download official assets
        run: |
          mkdir -p _brand/raw _brand/shots
          cd _brand/raw
          dl(){ curl -sSL -A "Mozilla/5.0" -o "$1" "$2" || true; }
          dl nccal-logo-color.svg https://www.nccal.gov.kw/sites/default/files/2025-12/logo-color.svg
          dl nccal-logo-white.png https://www.nccal.gov.kw/sites/default/files/2026-06/226-png-white.png
          dl nccal-favicon.svg https://www.nccal.gov.kw/themes/custom/nccal_theme/favicon.svg
          dl nccal-reveal-logo.svg https://www.nccal.gov.kw/themes/custom/nccal_theme/dist/assets/images/reveal-logo.svg
          dl nccal-pattern-1.svg https://www.nccal.gov.kw/themes/custom/nccal_theme/dist/assets/images/pattern-1.svg
          dl nccal-shape-pattern.svg https://www.nccal.gov.kw/themes/custom/nccal_theme/dist/assets/images/shape-pattern.svg
          i=0; for id in ef6ba310-70f8-4d89-8754-d6acb6912e8c 9f100615-10d3-42d2-ace2-8170850ce899 93680bdc-9f81-433f-9007-01bb79bba9d7 d2c4878d-3577-4000-a77b-0ead2bbb4f77 b3e8a485-9f03-444e-a825-1cd34408ad7e 521b4d0e-a1f6-4c89-bb45-c96fa3a5a434 bcf5e986-7cf0-4ca3-880a-c577d8562bca 48c9ae4b-21ff-41b7-993b-fe2dff3bb277 3d2be913-6094-477d-916d-ba2080f29c40; do i=$((i+1)); dl "fair-asset-$i-$id" "https://bookfair.nccal.gov.kw/media/home/assets/$id"; done
          for f in pattern-green.png diamonds-green.png diamonds-red.png quote-red-close.png quote-cream-close.png qatar-map.svg; do dl "fair-$f" "https://bookfair.nccal.gov.kw/design/demo/assets/$f"; done
          dl fair-home.html https://bookfair.nccal.gov.kw/ar
          dl nccal-home.html https://www.nccal.gov.kw/ar
          file * > ../files.txt || true
          grep -oE 'href="[^"]+\.css[^"]*"' fair-home.html | sed 's/href="//;s/"$//' > ../fair-css.txt || true
          n=0; while read u; do n=$((n+1)); case "$u" in http*) ;; *) u="https://bookfair.nccal.gov.kw$u";; esac; dl "fair-$n.css" "$u"; done < ../fair-css.txt
      - name: screenshots
        run: |
          npm i -g playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require(process.env.NODE_PATH ? 'playwright' : 'playwright');
          (async()=>{const b=await chromium.launch();
          for (const [n,u,w,h] of [['fair-desktop','https://bookfair.nccal.gov.kw/ar',1440,900],['fair-mobile','https://bookfair.nccal.gov.kw/ar',390,844],['nccal-desktop','https://www.nccal.gov.kw/ar',1440,900]]){
            const p=await b.newPage({viewport:{width:w,height:h}}); try{await p.goto(u,{waitUntil:'networkidle',timeout:60000});await p.waitForTimeout(4000);await p.screenshot({path:`_brand/shots/${n}.png`,fullPage:true});}catch(e){console.log(n,e.message)} await p.close();}
          await b.close();})();
          JS
          NODE_PATH=$(npm root -g) node shot.js
      - name: commit
        run: |
          git config user.name "daleel-bot"; git config user.email "actions@users.noreply.github.com"
          git add _brand && git commit -m "brand assets (fetch)" && git push || echo nothing
