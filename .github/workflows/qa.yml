name: qa
on: workflow_dispatch
permissions: {contents: write}
jobs:
  qa:
    strategy: {fail-fast: false, matrix: {include: [{os: macos-latest, set: mac, eng: "webkit chromium firefox"}, {os: windows-latest, set: win, eng: "firefox"}]}}
    runs-on: ${{ matrix.os }}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1 >/dev/null 2>&1 && npx playwright install ${{ matrix.eng }} >/dev/null 2>&1
      - run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 3
          node .qa/run.js out ${{ matrix.set }}
      - run: |
          cd out && git init -q && git checkout -q -b qa-${{ matrix.set }} && git add . && git -c user.name=bot -c user.email=b@x commit -qm qa
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" qa-${{ matrix.set }}
