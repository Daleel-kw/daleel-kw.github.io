name: safari-test
on: workflow_dispatch
permissions: {contents: write}
jobs:
  t:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install webkit >/dev/null 2>&1
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          cat > s.js <<'JS'
          const {webkit,devices}=require('playwright');(async()=>{const b=await webkit.launch();
          const c=await b.newContext({...devices['iPhone 14']});const p=await c.newPage();
          await p.goto('http://localhost:8000/_t/t.html');await p.waitForTimeout(1500);await p.screenshot({path:'_t/webkit-test.png',fullPage:true});
          await p.goto('http://localhost:8000/index.html');await p.waitForTimeout(2500);await p.screenshot({path:'_t/webkit-site.png'});
          await p.evaluate(()=>scrollTo(0,700));await p.waitForTimeout(1200);await p.screenshot({path:'_t/webkit-site2.png'});
          await b.close()})();
          JS
          node s.js
      - run: |
          git config user.name daleel-bot; git config user.email actions@users.noreply.github.com
          git add _t/*.png && git commit -m "safari test shots" && git push
